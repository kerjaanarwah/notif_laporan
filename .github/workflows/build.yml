name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build APK (plugin cetak opsional, otomatis dilepas jika gagal)
        run: |
          npm install
          build() { npx cap sync android && (cd android && chmod +x gradlew && ./gradlew assembleDebug); }
          npx cap add android
          npm install cordova-plugin-printer --no-save
          if ! build; then
            echo "::warning::Build dengan plugin cetak gagal. Membangun ulang tanpa plugin (tombol cetak di APK dinonaktifkan)."
            rm -rf android node_modules/cordova-plugin-printer
            npx cap add android
            build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pengingat-laporan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
